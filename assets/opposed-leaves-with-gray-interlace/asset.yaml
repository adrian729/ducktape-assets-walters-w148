# descriptive: find it and understand it
id: opposed-leaves-with-gray-interlace
title: Opposed leaves in gray interlace, repeat tile
description: "One cycle of a vertical band on burnished gold: a pale gray-mauve ribbon outlined in black loops into four heart-shaped compartments on a dark ground, the outer two holding red three-lobed leaves that point outward and the middle two blue leaves that point in toward each other; a red rule with a white line runs along the left edge. The pattern continues across the top and bottom edges and the band is fully opaque."
type: border
categories:
  - floral
  - knotwork
subjects:
  - leaf
  - ribbon
  - interlace
colors:
  - gold
  - red
  - blue
  - gray
  - black
facing: none
composition: repeat-tile

# structural: how it is organised and related
group: 31r
