  tile:
    axis: y
    period: 1
components:
  corner-top-left:
    master: corner-top-left.png
    description: Top-left corner cut from the same initial, a red three-lobed leaf in a triangular compartment of the ribbon with the red rule turning the inner angle; transparent along its outer top and left edges. Its painted field is 517 px deep against the band's 419 px, so it is for hand-built frames only.
  corner-top-right:
    master: corner-top-right.png
    description: Top-right corner from the same initial with its red leaf arranged for the right-hand angle, same depth as corner-top-left; for hand-built frames only.
related:
  - asset: walters-w148/lobed-leaves-in-gold-medallions
    role: companion
usage_notes:
  - Repeat along y; the generated rotated tile gives the horizontal band. The red rule is the inner edge, keep it toward the framed content.
  - "No frame atlas: the corners are about 98 px deeper than the band inside the red rule and would protrude into the framed area, so build a frame by hand from the band and the two corner components, aligning the red rules."
