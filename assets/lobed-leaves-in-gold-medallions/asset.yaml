# descriptive: find it and understand it
id: lobed-leaves-in-gold-medallions
title: Lobed leaves in gold medallions, repeat tile
description: "One cycle of a horizontal band: three burnished gold roundels ringed in olive green hold a red, a blue and a gray-blue lobed leaf on a dark ground, joined by green stems with small curled leaves between them; a thin red rule with a pale line runs along the bottom edge. The pattern continues across the left and right edges; the strip above the band and a thinner one below the red rule are transparent."
type: border
