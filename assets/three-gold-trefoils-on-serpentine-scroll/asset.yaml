# descriptive: find it and understand it
id: three-gold-trefoils-on-serpentine-scroll
title: Gold scroll with three trefoils
description: A burnished gold band winds in a serpentine from a large spiral at the left through two smaller loops to a jagged cut end at the right, each loop holding a gold three-lobed trefoil, with a short tendril dropping from the lower curve. Thin black contours edge the gold, which keeps the crackled texture of the leaf and a faint pale paper line along some edges; the background is transparent.
