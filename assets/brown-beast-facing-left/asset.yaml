id: brown-beast-facing-left
title: Brown beast with trefoil in its tail, facing left
description: A brown dragon-like quadruped walks to the left on four clawed feet, with a long arched neck, an open mouth, a pointed ear and a long tail that curls into a spiral behind it with a gold trefoil inside the curl. The body is brown with small cream drop-shaped marks and black contours, with thin green fringes from the initial's ground along parts of the outline; the background is transparent.
